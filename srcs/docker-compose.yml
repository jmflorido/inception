services:
  nginx:
    build: ./requirements/nginx
    image: nginx:1.0
    networks:
      - inception
    container_name: nginx
    depends_on:
      - wordpress
      - portainer
    ports: 
      - "0.0.0.0:${DOMAIN_PORT:-443}:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    volumes:
      - wordpress_data:/var/www/html:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q --spider https://localhost:${DOMAIN_PORT:-443}/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  mariadb:
    build: ./requirements/mariadb
    image: mariadb:1.0
    container_name: mariadb
    environment:
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    build: ./requirements/wordpress
    image: wordpress:1.0
    container_name: wordpress
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - WP_TITLE=${WP_TITLE}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - DOMAIN_PORT=${DOMAIN_PORT}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - WP_ADMIN_USER=${WP_ADMIN_USER}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
      - WP_USER=${WP_USER}
      - WP_USER_EMAIL=${WP_USER_EMAIL}
      - WP_UID=${WP_UID}
      - WP_TEMP_USER=${WP_TEMP_USER}
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
      - redis_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pgrep php-fpm"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  redis:
    build: ./requirements/redis
    image: redis:1.0
    container_name: redis
    networks:
      - inception
    depends_on:
      mariadb:
        condition: service_healthy
    secrets:
      - redis_password
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6379 ping --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  vsftpd:
    build: ./requirements/vsftpd
    image: vsftpd:1.0
    container_name: vsftpd
    networks:
      - inception
    depends_on:
      - wordpress
    environment:
      - WP_UID=${WP_UID}
      - FTP_USER=${FTP_USER}
    secrets:
      - ftp_user_password
    volumes:
      - wordpress_data:/home/${FTP_USER}/ftp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep vsftpd"]
      interval: 30s
      timeout: 5s
      retries: 3

  adminer:
    build: ./requirements/adminer
    image: adminer:1.0
    container_name: adminer
    networks:
      - inception
    depends_on:
      mariadb:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  portainer:
    build: ./requirements/portainer
    image: portainer:1.0
    container_name: portainer
    networks:
      - inception
#    depends_on:
#      - mariadb
#      - wordpress
#      - nginx
#      - adminer
    volumes:
      - docker_sock:/var/run
      - portainer_data:/data
    security_opt:
     - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q --spider https://localhost:9443/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  redis_password:
    file: ../secrets/redis_password.txt
  ftp_user_password:
    file: ../secrets/ftp_user_password.txt

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/joflorid/data/mariadb/
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/joflorid/data/wordpress/
  docker_sock:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/run/
  portainer_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/joflorid/data/portainer/

networks:
  inception:
    name: inception
    driver: bridge
    
